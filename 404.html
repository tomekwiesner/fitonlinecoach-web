<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nie ma takiej strony — FitOnlineCoach</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180.png">
<style>
  @font-face{font-family:'Montserrat';src:url('/assets/fonts/Montserrat-VF.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
  @font-face{font-family:'Inter';src:url('/assets/fonts/Inter-VF.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0B0F0D;color:#CFD8D2;padding:32px;
    font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.6}
  h1,.kod,a.wroc{font-family:'Montserrat',sans-serif}
  .box{max-width:460px;text-align:center}
  img{height:64px;width:auto;margin-bottom:36px}
  .kod{font-size:.78rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;
    color:#99E66D;margin-bottom:14px}
  h1{font-size:clamp(1.6rem,6vw,2.3rem);font-weight:800;color:#fff;margin-bottom:16px;line-height:1.2}
  p{color:#8B968F;margin-bottom:32px}
  a.wroc{display:inline-block;background:#99E66D;color:#0B0F0D;text-decoration:none;
    font-weight:700;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;
    padding:16px 34px;border-radius:2px;transition:.25s}
  a.wroc{-webkit-tap-highlight-color:transparent;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -4px 8px rgba(11,15,13,.16),0 8px 18px rgba(0,0,0,.5),0 0 30px rgba(153,230,109,.26)}
  @media (hover:hover) and (pointer:fine){
    a.wroc:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -4px 8px rgba(11,15,13,.16),0 12px 24px rgba(0,0,0,.55),0 0 52px rgba(153,230,109,.36)}
  }
  a.wroc:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 3px rgba(11,15,13,.28),0 3px 8px rgba(0,0,0,.45)}
  a.wroc:focus-visible{outline:2px solid #f7f8f9;outline-offset:3px}
  @media (prefers-reduced-motion:no-preference){
    @media (hover:hover) and (pointer:fine){a.wroc:hover{translate:0 -2px}}
    a.wroc:active{translate:0 1px}
  }
</style>
</head>
<body>
  <div class="box">
    <img src="/assets/logo_stacked.png" alt="FitOnlineCoach">
    <div class="kod">Błąd 404</div>
    <h1>Nie ma takiej strony.</h1>
    <p>Adres jest błędny albo strona została przeniesiona. Wróć na stronę główną — tam znajdziesz plan treningowy i&nbsp;odpowiedzi na najczęstsze pytania.</p>
    <a class="wroc" href="/">Strona główna</a>
  </div>
  <script>document.addEventListener('touchstart', () => {}, { passive: true });</script>
</body>
</html>
