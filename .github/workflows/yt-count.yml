name: Odswiez licznik poradnikow YouTube

# Codziennie nad ranem automat przelicza filmy w playlistach, do ktorych linkuja karty
# w sekcji „Poradniki wideo" (atrybut data-pl="PL..." w index.html), i zapisuje wynik do
# assets/yt.json: "playlisty" = liczba filmow kazdej playlisty (podpis karty „62 filmy"),
# "count" = filmy PIERWSZEJ karty, „Technika cwiczen" = instruktaze (tytul „62 darmowe poradniki wideo").
# Druga karta (Biblioteka cwiczen = filmy pokazowe) NIE wchodzi do tytulu: decyzja Tomka 3.09 — pokazowek
# nie liczymy jako poradnikow (stare „80" bylo bledem). Przy 0 strona pokazuje tytul
# bez liczby, a karty bez liczby filmow. Zmiana kart na stronie = automat sam liczy nowe.
# Liczbe bierzemy z naglowka playlisty (pole "stats"), a nie z liczenia identyfikatorow
# filmow — strona playlisty pokazuje tylko pierwsze 100 (sprawdzone 11.11.2026: "stats" = 62).
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # przypiete do konkretnego commita (v4.2.2), nie do ruchomego tagu — bezpieczenstwo lancucha dostaw
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Policz poradniki
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, datetime, sys
          P = 'assets/yt.json'
          d = json.load(open(P, encoding='utf-8'))
          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120', 'Accept-Language': 'pl-PL,pl;q=0.9'}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read().decode('utf-8', 'ignore')
          # playlisty = te, do ktorych linkuja karty na stronie (bez powtorzen, w kolejnosci ze strony)
          ids = list(dict.fromkeys(re.findall(r'data-pl="(PL[A-Za-z0-9_-]+)"', open('index.html', encoding='utf-8').read())))
          pl = {}
          for pid in ids:
              html = get('https://www.youtube.com/playlist?list=' + pid)
              m = re.search(r'"stats":\[\{"runs":\[\{"text":"([0-9][0-9  ]*)"', html)
              if m:
                  n = int(re.sub(r'\D', '', m.group(1)))
              else:
                  vids = set(re.findall(r'"videoId":"([A-Za-z0-9_-]{11})"', html))
                  if not vids and 'playlist' not in html.lower():
                      print('Strona playlisty', pid, 'nie odpowiedziala — zostawiam poprzednie liczby.'); sys.exit(0)
                  n = len(vids)
              print('Playlista', pid, '— filmow:', n)
              pl[pid] = n
          count = pl.get(ids[0], 0) if ids else 0   # tylko instruktaze (pierwsza karta), patrz naglowek
          print('Poradnikow razem:', count)
          for k in ('playlist', 'url'):
              d.pop(k, None)   # pola starej wersji (jedna playlista „poradnik"), strona ich nie czyta
          d.update({'count': count, 'playlisty': pl, 'updated': datetime.date.today().isoformat()})
          json.dump(d, open(P, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY

      - name: Zapisz zmiane
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/yt.json
          git diff --staged --quiet || git commit -m "Aktualizacja licznika poradnikow YouTube"
          git push
